name: Build Matinee

# Builds an unsigned Matinee.ipa on a GitHub-hosted Mac and publishes it as a release with an
# AltStore/SideStore source. If the repo holds an uploaded Matinee.zip or Matinee.tar.xz instead of
# the project files, the first run unpacks it and commits the files, so later edits can be made file by file.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unpack an uploaded project
        run: |
          archive=""
          for f in Matinee.tar.xz Matinee.zip; do [ -f "$f" ] && archive="$f" && break; done
          if [ -z "$archive" ]; then echo "No archive to unpack."; exit 0; fi
          rm -rf unpacked && mkdir unpacked
          case "$archive" in
            *.zip) unzip -q -o "$archive" -d unpacked ;;
            *) tar -xJf "$archive" -C unpacked ;;
          esac
          src=$(dirname "$(find unpacked -maxdepth 3 -name project.yml | head -1)")
          if [ "$src" = "." ] || [ -z "$src" ]; then echo "::error::project.yml not found in $archive"; exit 1; fi
          # The archive's copy of this workflow wins only if the repo doesn't already have one.
          if [ -f .github/workflows/build.yml ]; then rm -f "$src/.github/workflows/build.yml"; fi
          cp -R "$src"/. ./
          rm -rf unpacked "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack $archive into project files"
          git push

      - name: Check for the project
        id: check
        run: |
          if [ -f project.yml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No project.yml yet. Upload Matinee.zip to build."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build IPA
        if: steps.check.outputs.ok == 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash ci/build.sh

      - name: Publish release and AltStore source
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: bash ci/publish.sh

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
