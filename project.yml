name: Matinee

options:
  bundleIdPrefix: com.daniel
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Matinee:
    type: application
    platform: iOS
    sources:
      - path: Matinee
    dependencies:
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.matinee
        PRODUCT_NAME: Matinee
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Matinee/Info.plist
      properties:
        CFBundleDisplayName: Watcher
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIBackgroundModes: [audio]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes: [infuse, vlc-x-callback]
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: false

  MatineeTV:
    type: application
    platform: tvOS
    sources:
      - path: Matinee/App
        excludes: ["MatineeApp.swift"]
      - path: Matinee/Stremio
      - path: Matinee/Player
        excludes: ["MPVPlayerViewController.swift"]
      - path: Matinee/Views/SharedComponents.swift
      - path: MatineeTV
    dependencies:
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.matinee.tv
        PRODUCT_NAME: Matinee
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: MatineeTV/Info.plist
      properties:
        CFBundleDisplayName: Watcher
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes: [infuse]
        ITSAppUsesNonExemptEncryption: false

schemes:
  Matinee:
    build:
      targets:
        Matinee: all
    run:
      config: Debug
    archive:
      config: Release
  MatineeTV:
    build:
      targets:
        MatineeTV: all
    run:
      config: Debug
    archive:
      config: Release
